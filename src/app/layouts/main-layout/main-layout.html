<div class="layout-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo-section">

      <div class="logo">
        L
      </div>

      <div class="brand">
        <h2>LocLoc</h2>
        <span>Espace locataire</span>
      </div>

    </div>

    <nav class="menu">

      <p class="menu-section">EXPLORER</p>

      <a class="menu-item" routerLink="/app/listings" routerLinkActive="active">
        <span class="ic">🔍</span> Annonces
      </a>

      <a class="menu-item" routerLink="/app/requests" routerLinkActive="active">
        <span class="ic">📨</span> Mes demandes
      </a>

    </nav>

    <!-- USER CARD -->
    <div class="user-card">
      <div class="uavatar">{{ initial }}</div>
      <div class="user-info">
        <strong>{{ fullName }}</strong>
        <span>Locataire</span>
      </div>
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- HEADER -->
    <header class="topbar">

      <input
        type="text"
        placeholder="Search listings..."
      />

      <div class="topbar-right">

        <button
          class="logout-btn"
          (click)="logout()"
        >
          Logout
        </button>

        <div class="profile">
          USER
        </div>

      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
