<div class="admin-layout">

  <!-- BACKDROP (mobile only, when sidebar open) -->
  @if (sidebarOpen()) {
    <div class="backdrop" (click)="closeSidebar()"></div>
  }

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.open]="sidebarOpen()">

    <div class="logo-section">
      <div class="logo">A</div>
      <h2>Admin</h2>
    </div>

    <nav class="menu" (click)="closeSidebar()">
      <a class="menu-item" routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
      <a class="menu-item" routerLink="/admin/users" routerLinkActive="active">Users</a>
      <a class="menu-item" routerLink="/admin/properties" routerLinkActive="active">Properties</a>
      <a class="menu-item" routerLink="/admin/reports" routerLinkActive="active">Reports</a>
      <a class="menu-item" routerLink="/admin/payments" routerLinkActive="active">Payments</a>
      <a class="menu-item" routerLink="/admin/listings" routerLinkActive="active">Annonces</a>
    </nav>

  </aside>

  <!-- MAIN -->
  <div class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-left">
        <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">☰</button>
        <h1>Admin Dashboard</h1>
      </div>

      <div class="topbar-right">
        <button class="logout-btn" (click)="logout()">Logout</button>
        <div class="profile">ADMIN</div>
      </div>

    </header>

    <!-- CONTENT (les pages s'affichent ici) -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
