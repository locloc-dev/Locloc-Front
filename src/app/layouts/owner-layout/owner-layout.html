<div class="owner-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo-section">
      <div class="logo">L</div>
      <div class="brand">
        <h2>LocLoc</h2>
        <span>Espace propriétaire</span>
      </div>
    </div>

    <nav class="menu">

      <p class="menu-section">GÉRER</p>

      <a class="menu-item" routerLink="/owner/ads" routerLinkActive="active">
        <span class="ic">🏠</span> Mes annonces
      </a>

      <a class="menu-item" routerLink="/owner/new-listing" routerLinkActive="active">
        <span class="ic">➕</span> Créer une annonce
      </a>

      <a class="menu-item" routerLink="/owner/requests" routerLinkActive="active">
        <span class="ic">📨</span> Demandes reçues
      </a>

      <a class="menu-item" routerLink="/owner/listings" routerLinkActive="active">
        <span class="ic">📄</span> Mes biens
      </a>

      <p class="menu-section">DÉCOUVRIR</p>

      <a class="menu-item" routerLink="/app/listings">
        <span class="ic">🔍</span> Parcourir les annonces
      </a>

    </nav>

    <!-- USER CARD -->
    <div class="user-card">
      <div class="avatar">{{ initial }}</div>
      <div class="user-info">
        <strong>{{ fullName }}</strong>
        <span>{{ roleLabel() }}</span>
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="main-content">

    <header class="topbar">
      <h1>Owner Dashboard</h1>
      <div class="topbar-right">
        <button class="logout-btn" (click)="logout()">Se déconnecter</button>
      </div>
    </header>

    <main class="page-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
