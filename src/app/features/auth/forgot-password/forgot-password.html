<div class="auth-page">
  <div class="auth-box">

    <div class="logo-section">
      <div class="logo">L</div>
      <h2 class="brand"><span class="b-blue">Loc</span><span class="b-green">Loc</span></h2>
    </div>

    <h1 class="title">Mot de passe oublié ?</h1>
    <p class="subtitle">
      Entre ton adresse e-mail. On t'envoie un code à 6 chiffres pour
      réinitialiser ton mot de passe.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>Adresse e-mail</label>
        <div class="input-icon">
          <span class="icon">✉️</span>
          <input type="email" formControlName="email" placeholder="Email" />
        </div>
        <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          <span *ngIf="form.get('email')?.errors?.['required']">Email requis</span>
          <span *ngIf="form.get('email')?.errors?.['email']">Format email invalide</span>
        </div>
      </div>

      <div class="server-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="primary-btn" [disabled]="isLoading">
        {{ isLoading ? 'Envoi...' : 'Envoyer le code' }}
      </button>

    </form>

    <p class="back-link">
      <a (click)="goToLogin()">← Retour à la connexion</a>
    </p>

  </div>
</div>
