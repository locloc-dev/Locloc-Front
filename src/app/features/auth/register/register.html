<div class="register-page">

  <!-- LEFT SIDE (image naturelle) -->
  <div class="left-section">
    <div class="overlay"></div>
    <div class="branding">
      <span class="small-title">LOCLOC</span>
      <h1>Find a place that<br>actually feels like home.</h1>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-section">
    <div class="register-box">

      <!-- LOGO -->
      <div class="logo-section">
        <div class="logo">L</div>
        <h2 class="brand"><span class="b-blue">Loc</span><span class="b-green">Loc</span></h2>
      </div>

      <h1 class="title">Crée ton compte</h1>
      <p class="subtitle">Rejoins les locataires, acheteurs et propriétaires.</p>

      <!-- ROLE -->
      <div class="role-selection">
        <p class="role-title">Je veux :</p>
        <div class="role-buttons">
          <button type="button" class="role-btn" [class.active-role]="selectedRole === 'TENANT'" (click)="selectRole('TENANT')">
            Louer / Acheter
          </button>
          <button type="button" class="role-btn" [class.active-role]="selectedRole === 'OWNER'" (click)="selectRole('OWNER')">
            Publier un bien
          </button>
        </div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button type="button" (click)="goToLogin()">Connexion</button>
        <button type="button" class="active">Inscription</button>
      </div>

      <!-- FORM -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <div class="row">
          <div class="input-group">
            <label>Prénom</label>
            <input type="text" placeholder="John" formControlName="firstName" />
            <div class="error" *ngIf="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid">
              <span *ngIf="registerForm.get('firstName')?.errors?.['required']">Prénom requis</span>
            </div>
          </div>

          <div class="input-group">
            <label>Nom</label>
            <input type="text" placeholder="Doe" formControlName="lastName" />
            <div class="error" *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid">
              <span *ngIf="registerForm.get('lastName')?.errors?.['required']">Nom requis</span>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="alex@locloc.fr" formControlName="email" />
          <div class="error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
            <span *ngIf="registerForm.get('email')?.errors?.['required']">Email requis</span>
            <span *ngIf="registerForm.get('email')?.errors?.['email']">Format email invalide</span>
          </div>
        </div>

        <div class="input-group">
          <label>Mot de passe</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" formControlName="password" />
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
          <div class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
            <span *ngIf="registerForm.get('password')?.errors?.['required']">Mot de passe requis</span>
            <span *ngIf="registerForm.get('password')?.errors?.['minlength']">6 caractères minimum</span>
          </div>
        </div>

        <div class="input-group">
          <label>Confirmer le mot de passe</label>
          <div class="password-wrapper">
            <input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="••••••••" formControlName="confirmPassword" />
            <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
              {{ showConfirmPassword ? '🙈' : '👁️' }}
            </button>
          </div>
          <div class="error" *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid">
            <span *ngIf="registerForm.get('confirmPassword')?.errors?.['required']">Confirmation requise</span>
          </div>
        </div>

        <input type="hidden" formControlName="role" />

        <button type="submit" class="register-btn" [disabled]="isLoading">
          {{ isLoading ? 'Création...' : 'Créer le compte' }}
        </button>
      </form>

    </div>
  </div>

</div>
