<div class="login-page">

  <!-- LEFT SIDE -->
  <div class="left-section">

    <div class="overlay"></div>

    <div class="branding">

      <span class="small-title">
        LOCLOC
      </span>

      <h1>
        Find a place that
        <br>
        actually feels like home.
      </h1>

    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="right-section">

    <div class="login-box">

      <!-- LOGO -->
      <div class="logo-section">
        <div class="logo">L</div>
        <h2 class="brand"><span class="b-blue">Loc</span><span class="b-green">Loc</span></h2>
      </div>

      <h1 class="welcome-title">Bon retour !</h1>
      <p class="subtitle">Connecte-toi pour gérer tes annonces et tes demandes.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- EMAIL -->
        <div class="input-group">
          <label>Adresse e-mail</label>
          <div class="input-icon">
            <span class="icon">✉️</span>
            <input type="email" formControlName="email" placeholder="Email" />
          </div>
          <div class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email requis</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Format email invalide</span>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
          <label>Mot de passe</label>
          <div class="input-icon">
            <span class="icon">🔒</span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
            />
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
          <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Mot de passe requis</span>
          </div>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" />
            <span>Se souvenir de moi</span>
          </label>
          <a routerLink="/forgot-password">Mot de passe oublié ?</a>
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>

      </form>

      <div class="divider"><span>ou</span></div>

      <div class="google-btn-container" #googleBtn></div>
      <!-- SIGNUP -->
      <p class="signup">
        Pas encore de compte ?
        <a (click)="goToRegister()">Créer un compte</a>
      </p>

    </div>

  </div>

</div>
